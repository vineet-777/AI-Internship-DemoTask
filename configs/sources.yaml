sources:
  - id: arxiv
    name: arXiv
    record_type: research_paper
    mode: http
    enabled: true
    endpoint: "https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.LG+OR+cat:cs.CL&start={start}&max_results={max_results}&sortBy=submittedDate&sortOrder=descending"
    metadata_endpoint_template: "https://export.arxiv.org/api/query?id_list={arxiv_id}"
    batch_size: 100
    max_records: 1000

  - id: papers_with_code
    name: "Papers with Code archive"
    record_type: research_paper
    mode: http
    enabled: true
    # PWC's former site redirects to Hugging Face. This is its official archive
    # dataset, linked by paperswithcode/paperswithcode-data.
    links_endpoint_template: "https://datasets-server.huggingface.co/rows?dataset=pwc-archive%2Flinks-between-paper-and-code&config=default&split=train&offset={offset}&length={length}"
    batch_size: 100
    max_records: 1000
    require_official_implementation: true

  - id: ycombinator
    name: "Y Combinator company directory"
    record_type: startup
    mode: http
    enabled: true
    listing_url: "https://www.ycombinator.com/companies"
    page_size: 100
    max_records: 1000

  - id: crunchbase
    name: Crunchbase
    record_type: startup
    mode: api
    enabled: false
    reason: "Requires a licensed Crunchbase API key and plan-specific endpoint."

  - id: angellist
    name: AngelList / Wellfound
    record_type: startup
    mode: playwright
    enabled: false
    reason: "Requires a browser adapter for the JavaScript-rendered directory."

  - id: product_hunt
    name: Product Hunt
    record_type: product
    mode: http
    enabled: true
    listing_url: "https://www.producthunt.com/search?query=ai"
    page_size: 100
    max_records: 1000

  - id: theres_an_ai_for_that
    name: There's An AI For That
    record_type: product
    mode: http
    enabled: true
    listing_url: "https://theresanaiforthat.com/"
    page_size: 100
    max_records: 1000

  - id: techcrunch_ai
